name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore, test, and publish
        shell: pwsh
        run: |
          dotnet restore ObsidianDisplayGuard.slnx
          dotnet test tests/ObsidianDisplayGuard.Tests/ObsidianDisplayGuard.Tests.csproj -c Release
          dotnet publish src/ObsidianDisplayGuard/ObsidianDisplayGuard.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/win-x64
          $hash = (Get-FileHash artifacts/win-x64/ObsidianDisplayGuard.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ObsidianDisplayGuard.exe" | Set-Content artifacts/win-x64/ObsidianDisplayGuard.exe.sha256 -Encoding ascii

      - name: Attest executable provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: artifacts/win-x64/ObsidianDisplayGuard.exe

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            'artifacts/win-x64/ObsidianDisplayGuard.exe#ObsidianDisplayGuard.exe' `
            'artifacts/win-x64/ObsidianDisplayGuard.exe.sha256#SHA-256-checksum' `
            --repo $env:GITHUB_REPOSITORY `
            --title "Obsidian Display Guard $env:GITHUB_REF_NAME" `
            --generate-notes
